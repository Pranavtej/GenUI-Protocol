readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "AI-Native UI Runtime" }
]

[tool.poetry.dependencies]
python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"
