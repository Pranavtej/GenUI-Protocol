[project]
name = "genui_protocol_sdk"
version = "0.1.0"
description = "Python SDK for GenUI Protocol"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  { name = "GenUI Protocol" }
]

[tool.poetry.dependencies]
python = ">=3.11"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"
