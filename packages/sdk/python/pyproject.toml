[project]
name = "genui_protocol_sdk"
version = "0.2.0"
description = "Python SDK for GenUI Protocol: build, validate, patch and stream AI-generated UI documents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "GenUI Protocol" }]
dependencies = ["jsonschema>=4.18", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["genui_protocol_sdk*"]

[tool.setuptools.package-data]
genui_protocol_sdk = ["registry.json", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
