name: Docs

on:
  push:
    branches: [demo]
  pull_request:
    branches: [demo]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter ai-native-ui-docs lint
      - run: pnpm --filter ai-native-ui-docs build
