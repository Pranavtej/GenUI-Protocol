name: Docs

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    docs:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: pnpm/action-setup@v2
              with:
                  version: 8
            - uses: actions/setup-node@v7
              with:
                  node-version: 20
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm --filter genui-protocol-docs lint
            - run: pnpm --filter "genui-protocol-docs..." build
