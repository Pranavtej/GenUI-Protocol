name: Publish Python SDK

# Tag `py-v0.2.0` (matching packages/sdk/python/pyproject.toml) to publish genui_protocol_sdk to PyPI.
# Uses PyPI trusted publishing: configure the project on PyPI with this workflow and the `pypi` environment.
on:
    push:
        tags: ["py-v*"]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: Version matches the tag
              working-directory: packages/sdk/python
              run: |
                  v=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
                  [ "py-v$v" = "${GITHUB_REF_NAME}" ] || { echo "tag ${GITHUB_REF_NAME} != pyproject version $v"; exit 1; }
            - name: Test
              working-directory: packages/sdk/python
              run: |
                  pip install -e ".[dev]"
                  pytest
            - name: Build
              working-directory: packages/sdk/python
              run: |
                  pip install build
                  python -m build
            - uses: actions/upload-artifact@v7
              with:
                  name: dist
                  path: packages/sdk/python/dist/

    publish:
        needs: build
        runs-on: ubuntu-latest
        environment: pypi
        permissions:
            id-token: write
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: dist
                  path: dist/
            - uses: pypa/gh-action-pypi-publish@release/v1
