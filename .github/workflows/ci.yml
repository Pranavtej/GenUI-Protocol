name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    node:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v2
              with:
                  version: 8
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: node scripts/sync-package-meta.mjs --check
            - run: pnpm build
            - run: pnpm lint
            - run: pnpm test

    # Proves the published artifacts work: packs every public package and runs a smoke test on a clean install.
    packages:
        runs-on: ubuntu-latest
        needs: node
        steps:
            - uses: actions/checkout@v7
            - uses: pnpm/action-setup@v2
              with:
                  version: 8
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm build
            - run: node scripts/release-check.mjs

    python:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.11"
            - name: SDK
              working-directory: packages/sdk/python
              run: |
                  pip install -e ".[dev]"
                  pytest
            - name: Agent
              working-directory: apps/python-test
              run: |
                  pip install -e ".[dev]"
                  pytest
